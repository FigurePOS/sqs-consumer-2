name: CI

on:
  pull_request:
  push:
    branches:
      - master

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && 'pr-' || 'branch-' }}${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

permissions:
  packages: read

jobs:
  check:
    runs-on: blacksmith-2vcpu-ubuntu-2204
    steps:
      - uses: actions/checkout@v6

      - name: Set Up Node.js
        uses: FigurePOS/github-actions/.github/actions/node-setup@v6

      - name: Install Dependencies
        uses: FigurePOS/github-actions/.github/actions/node-pnpm-install@v6

      - name: License Compliance Check
        run: pnpm run check:licenses
        shell: bash

      - name: Dependencies Check
        run: pnpm run check:deps
        shell: bash

  test:
    runs-on: blacksmith-2vcpu-ubuntu-2204
    steps:
      - uses: actions/checkout@v6

      - name: Set Up Node.js
        uses: FigurePOS/github-actions/.github/actions/node-setup@v6

      - name: Install Dependencies
        uses: FigurePOS/github-actions/.github/actions/node-pnpm-install@v6

      - name: Run Tests
        run: pnpm run ci:test
        shell: bash

